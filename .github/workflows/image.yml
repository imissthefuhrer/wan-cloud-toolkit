name: Build WAN Pod image (no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and test on CPU
        run: |
          set -Eeuo pipefail
          image="wan-cloud-toolkit:git-${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$image" .
          docker run --rm --entrypoint bash "$image" -c 'python3.11 tools/check_python_headers.py && python3.11 -m venv /tmp/probe && /tmp/probe/bin/python -m pip --version && test -x /usr/sbin/sshd && test -x /usr/local/cuda/bin/nvcc'
          docker image inspect "$image" --format '{{.Id}}'
          docker save "$image" | gzip > wan-cloud-toolkit.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wan-cloud-toolkit-${{ github.sha }}
          path: wan-cloud-toolkit.tar.gz
          retention-days: 7
