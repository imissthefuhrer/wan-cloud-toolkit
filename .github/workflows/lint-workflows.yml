name: Lint GitHub Actions workflows
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'tools/*actionlint*'
      - 'tools/lint_workflows.sh'
      - '.githooks/pre-push'
      - 'tests/test_workflow_lint.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/*actionlint*'
      - 'tools/lint_workflows.sh'
      - '.githooks/pre-push'
      - 'tests/test_workflow_lint.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: ./tools/install_actionlint.sh "$RUNNER_TEMP/wan-actionlint"
      - name: Validate all workflow expressions and syntax
        run: |
          export PATH="$RUNNER_TEMP/wan-actionlint:$PATH"
          ./tools/lint_workflows.sh
